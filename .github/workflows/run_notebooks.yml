# These notebooks rot quietly: a Colab page still opens, the cells still look
# right, and the failure only appears when somebody runs them in class. So run
# them here on a schedule instead, against the release the notebooks pin.
#
# Every notebook in Demos/ runs, and one of the course notebooks. The demos
# are written to fit a free runner: no GPU, nothing built from source, each a
# handful of cells. The other four course notebooks are each blocked on
# something of their own - see Courses/CMUSpeechTechnology26S/README.md - and
# adding one means finding that out first, not putting it in the matrix and
# hoping.
#
# What to install is asked of the notebook rather than written here twice:
# `run_notebook.py --print-install` reads its own pip lines. A demo that
# starts needing another extra says so in the cell a reader runs, and this
# installs it without being told again.

name: run notebooks

on:
  schedule:
    # Sundays, 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Demos/**"
      - "Courses/CMUSpeechTechnology26S/**"
      - "tools/**"
      - ".github/workflows/run_notebooks.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        notebook:
          - Demos/asr_demo.ipynb
          - Demos/asr_streaming_demo.ipynb
          - Demos/st_demo.ipynb
          - Demos/tts_demo.ipynb
          - Demos/enh_demo.ipynb
          - Demos/spk_demo.ipynb
          - Demos/codec_demo.ipynb
          - Courses/CMUSpeechTechnology26S/speaker_verification.ipynb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # the harness itself, before it can be asked anything
          python -m pip install nbclient nbformat ipykernel \
            librosa scikit-learn matplotlib tqdm soundfile editdistance
          # then what this notebook's own pip lines ask for. The runner skips
          # those cells, so installing a different espnet from the one a
          # reader gets would make a pass here mean nothing.
          python -m pip install $(python tools/run_notebook.py \
            "${{ matrix.notebook }}" --print-install)

      - name: Run ${{ matrix.notebook }}
        run: python tools/run_notebook.py "${{ matrix.notebook }}" --timeout 4800
