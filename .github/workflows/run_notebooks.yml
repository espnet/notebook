# These notebooks rot quietly: a Colab page still opens, the cells still look
# right, and the failure only appears when somebody runs them in class. So run
# them here on a schedule instead, against the release the notebooks pin.
#
# One notebook runs. speaker_verification is the one that fits a free runner:
# no GPU, no package that has to be built, and it finishes well inside the
# timeout. The others are each blocked on something of their own - see this
# directory's README - and adding one means finding that out first, not
# putting it in the matrix and hoping.

name: run notebooks

on:
  schedule:
    # Sundays, 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Courses/CMUSpeechTechnology26S/**"
      - ".github/workflows/run_notebooks.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        notebook:
          - speaker_verification.ipynb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # the runner skips the notebooks' install cells, so install what
          # they would have installed, pinned to the same release they pin -
          # testing a different espnet from the one Colab gets would make a
          # pass here mean nothing
          python -m pip install "espnet[enh]==202610.post1"
          python -m pip install nbclient nbformat ipykernel \
            librosa scikit-learn matplotlib tqdm soundfile editdistance

      - name: Run ${{ matrix.notebook }}
        working-directory: Courses/CMUSpeechTechnology26S
        run: python ../../tools/run_notebook.py "${{ matrix.notebook }}" --timeout 4800
