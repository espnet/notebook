# Courses/CMUSpeechTechnology26S/owsm_finetuning_ctc.ipynb, every Sunday. The badge on this workflow is what the
# README shows beside that notebook, which is why it has a file of its own:
# GitHub's badge is per workflow, and cannot show one job of a matrix.
#
# Fine-tuning runs at a size a free runner can finish: four clips per word
# rather than sixty, two steps rather than three hundred, and three test
# clips rather than the whole split.
# A reader who opens the notebook gets the full run; this checks that it still
# installs, still finds its data, and still agrees with ESPnet3's API.

name: owsm_finetuning_ctc

on:
  schedule:
    # Sundays, 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Courses/CMUSpeechTechnology26S/owsm_finetuning_ctc.ipynb"
      - "tools/**"
      - ".github/workflows/owsm_finetuning_ctc.yml"
      - ".github/workflows/_run_notebook.yml"

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_run_notebook.yml
    with:
      notebook: Courses/CMUSpeechTechnology26S/owsm_finetuning_ctc.ipynb
      env_json: '{"PER_WORD": "4", "LIMIT_TRAIN_BATCHES": "2", "MAX_TEST_CLIPS": "3"}'
