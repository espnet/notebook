# Demos/spk_demo.ipynb, every Sunday. The badge on this workflow is what the
# README shows beside that notebook, which is why it has a file of its own:
# GitHub's badge is per workflow, and cannot show one job of a matrix.

name: spk_demo

on:
  schedule:
    # Sundays, 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Demos/spk_demo.ipynb"
      - "tools/**"
      - ".github/workflows/spk_demo.yml"
      - ".github/workflows/_run_notebook.yml"

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_run_notebook.yml
    with:
      notebook: Demos/spk_demo.ipynb
