# Demos/diar_vad_demo.ipynb, every Sunday. The badge on this workflow is what
# the README shows beside that notebook, which is why it has a file of its own:
# GitHub's badge is per workflow, and cannot show one job of a matrix.

name: diar_vad_demo

on:
  schedule:
    # Sundays, 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Demos/diar_vad_demo.ipynb"
      - "tools/**"
      - ".github/workflows/diar_vad_demo.yml"
      - ".github/workflows/_run_notebook.yml"

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_run_notebook.yml
    with:
      notebook: Demos/diar_vad_demo.ipynb
      # the VAD classes in espnet2.bin.diar_inference are not in a release yet: the
      # notebook pins the one that will carry them
      allow_unreleased_pin: true
