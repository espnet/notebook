# Runs one notebook. Called by the per-notebook workflows beside this file.
#
# One workflow per notebook, rather than one matrix over all of them, because
# a badge is per workflow: GitHub has no way to show the status of one job in
# a matrix. A table of notebooks with a badge each is worth nine small files
# that do nothing but name their notebook and call this.

name: run one notebook

on:
  workflow_call:
    inputs:
      notebook:
        required: true
        type: string
      # What the notebook reads from the environment to run smaller here than
      # it does for a reader. Only the fine-tuning notebooks use it: a free
      # runner cannot fine-tune at full size, and a badge that says "this
      # notebook runs" is still worth having for the installs, the data and
      # the API. What each one shrinks is said in its own workflow.
      env_json:
        required: false
        type: string
        default: "{}"
      # A notebook for something that has merged but not shipped pins the
      # release that will carry it, and pip cannot install a version PyPI does
      # not have yet. With this, the job says so and stops, instead of failing
      # on an install nobody can fix from here. The alternative - installing
      # espnet from git - would check something other than what a reader gets,
      # which is the one thing tools/README.md says this must not do.
      # The notebook's own workflow sets it and names the release it waits
      # for; a run that is still skipping weeks later is a pin nobody
      # finished.
      allow_unreleased_pin:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # a map rather than a shell line, so nothing here is interpolated into a
    # command
    env: ${{ fromJSON(inputs.env_json) }}
    steps:
      # See the espnet repository's CI: the default persists GITHUB_TOKEN in
      # .git/config, and nothing here needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        id: install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # the harness itself, before it can be asked anything
          python -m pip install nbclient nbformat ipykernel \
            librosa scikit-learn matplotlib tqdm soundfile editdistance
          # The release the notebook pins has to be on PyPI. It is not, for a
          # notebook written between a feature merging and the release that
          # carries it - see allow_unreleased_pin above.
          asked=$(python tools/run_notebook.py \
            "${{ inputs.notebook }}" --print-install)
          pinned=$(printf '%s\n' $asked \
            | grep -E '^espnet(\[[a-z,]+\])?==' || true)
          version=${pinned##*==}
          if [ -n "$version" ] && ! curl -sf -o /dev/null \
              "https://pypi.org/pypi/espnet/$version/json"; then
            if [ "${{ inputs.allow_unreleased_pin }}" != "true" ]; then
              echo "::error::this notebook pins espnet $version, which is" \
                "not on PyPI"
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "espnet $version is not on PyPI yet, so there is nothing to" \
              "install and nothing to run: this notebook is waiting for that" \
              "release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # then what this notebook's own pip lines ask for. The runner skips
          # those cells, so installing a different espnet from the one a
          # reader gets would make a pass here mean nothing.
          python -m pip install $asked
          # and what it clones and installs - VERSA and ParallelWaveGAN are
          # on nobody's index. --no-build-isolation because ParallelWaveGAN's
          # setup.py imports pip, which an isolated build does not have.
          from_git=$(python tools/run_notebook.py \
            "${{ inputs.notebook }}" --print-git-install)
          if [ -n "$from_git" ]; then
            python -m pip install --no-build-isolation $from_git
          fi

      - name: Run ${{ inputs.notebook }}
        if: steps.install.outputs.skip != 'true'
        run: python tools/run_notebook.py "${{ inputs.notebook }}" --timeout 4800
