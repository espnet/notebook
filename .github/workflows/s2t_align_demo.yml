# Demos/s2t_align_demo.ipynb, every Sunday. The badge on this workflow is what
# the README shows beside that notebook, which is why it has a file of its own:
# GitHub's badge is per workflow, and cannot show one job of a matrix.

name: s2t_align_demo

on:
  schedule:
    # Sundays, 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Demos/s2t_align_demo.ipynb"
      - "tools/**"
      - ".github/workflows/s2t_align_demo.yml"
      - ".github/workflows/_run_notebook.yml"

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_run_notebook.yml
    with:
      notebook: Demos/s2t_align_demo.ipynb
      # espnet2.bin.align merged after v.202610.post1 was tagged, so the
      # release this notebook pins does not exist yet (espnet#6791 cuts it).
      # Until then the job says so and skips. Delete this line when
      # 202610.post2 is on PyPI - and if it is still here a month from now,
      # the pin was never finished.
      allow_unreleased_pin: true
