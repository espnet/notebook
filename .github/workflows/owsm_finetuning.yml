# Courses/CMUSpeechTechnology26S/owsm_finetuning.ipynb, every Sunday. The badge on this workflow is what the
# README shows beside that notebook, which is why it has a file of its own:
# GitHub's badge is per workflow, and cannot show one job of a matrix.
#
# Fine-tuning runs at a size a free runner can finish: eight utterances
# of the validation split rather than the training split, and two steps.
# A reader who opens the notebook gets the full run; this checks that it still
# installs, still finds its data, and still agrees with ESPnet3's API.

name: owsm_finetuning

on:
  schedule:
    # Sundays, 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Courses/CMUSpeechTechnology26S/owsm_finetuning.ipynb"
      - "tools/**"
      - ".github/workflows/owsm_finetuning.yml"
      - ".github/workflows/_run_notebook.yml"

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_run_notebook.yml
    with:
      notebook: Courses/CMUSpeechTechnology26S/owsm_finetuning.ipynb
      env_json: '{"FLEURS_TRAIN_SPLIT": "validation[:8]", "FLEURS_VALID_SPLIT": "validation[8:12]", "FLEURS_TEST_SPLIT": "validation[12:14]", "LIMIT_TRAIN_BATCHES": "2"}'
